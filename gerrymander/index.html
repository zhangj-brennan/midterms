<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Changes in recently redrawn states</title>
<!--
  Wrapper page: a wide House / Senate toggle above a frame that shows
  house.html or senate.html. Each map page reports its height to this page,
  which sizes the frame to fit, and this page in turn reports its own height
  to the embedding page (e.g. Drupal), so there's no extra white space.
-->
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="chamber-page" id="chamberPage">
  <div id="title" class="chamber-title">
    <h1>Changes in recently redrawn states</h1>
  </div>
  <div class="chamber-toggle" role="group" aria-label="Choose chamber">
    <button type="button" class="chamber-btn active" data-src="house.html?inframe" aria-pressed="true">House</button>
    <button type="button" class="chamber-btn" data-src="senate.html?inframe" aria-pressed="false">Senate</button>
  </div>
  <iframe class="chamber-frame" id="chamberFrame" src="house.html?inframe" scrolling="no" title="Change in House seats map"></iframe>
</div>

<script>
(function () {
  var frame = document.getElementById("chamberFrame");
  var page = document.getElementById("chamberPage");
  var buttons = document.querySelectorAll(".chamber-btn");

  // Switch which map the frame shows.
  buttons.forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (btn.classList.contains("active")) return;
      buttons.forEach(function (b) {
        var on = b === btn;
        b.classList.toggle("active", on);
        b.setAttribute("aria-pressed", on);
      });
      frame.src = btn.dataset.src;
      frame.title = "Change in " + btn.textContent + " seats map";
    });
  });

  // Size the frame to the map page's reported height.
  window.addEventListener("message", function (e) {
    if (e.source !== frame.contentWindow) return;
    if (e.data && e.data.type === "brennan-embed-resize") {
      frame.style.height = e.data.height + "px";
    }
  });

  // When embedded (e.g. in Drupal), report this page's own height upward.
  if (window.self === window.top) return;
  function reportHeight() {
    var height = Math.ceil(page.getBoundingClientRect().bottom + window.scrollY);
    window.parent.postMessage({ type: "brennan-embed-resize", height: height }, "*");
  }
  new ResizeObserver(reportHeight).observe(page);
  window.addEventListener("load", reportHeight);
  reportHeight();
})();
</script>
</body>
</html>
